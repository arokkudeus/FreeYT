name: Build IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project YTLite.xcodeproj \
            -target YTLite \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/Release-iphoneos/YTLite.app"
          test -d "$APP_PATH" || { echo "App not found: $APP_PATH"; ls -R build | head -50; exit 1; }
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry YTLite.ipa Payload
          ls -lh YTLite.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YTLite-ipa
          path: YTLite.ipa
          retention-days: 30
