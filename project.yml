# XcodeGen の設定ファイル（GitHub Actions 上でこれから Xcode プロジェクトを生成する）
name: YTLite

options:
  bundleIdPrefix: io.github.ytlite
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  YTLite:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: YTLite
        excludes:
          - "Resources/**"
      - path: YTLite/Resources
        buildPhase: resources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: YT Lite
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIViewControllerBasedStatusBarAppearance: true
        # バックグラウンドでも音声を流し続けるための設定
        UIBackgroundModes:
          - audio
        # アプリ本体は縦固定。iOS標準の全画面プレーヤーだけ横にできるよう横向きも許可しておく
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ytlite.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
